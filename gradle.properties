# JVM args for the Gradle daemon. 4 GB is enough for this project and keeps
# headroom on machines that also run other heavy tooling.
#
# NOTE (local network quirk): on this machine a local proxy ("SteamTools" /
# Steam++) terminates TLS for github.com and its asset hosts, so the Gradle
# wrapper distribution and any GitHub asset download fails with
# "PKIX path building failed" against the stock JDK truststore. The truststore
# below is the stock one plus that proxy's two roots. It is machine-local
# (`.certs/` is git-ignored) and harmless elsewhere: if the file is absent the
# daemon falls back to the default truststore.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=D:\\code\\DeepSeekHarness\\keyforge\\.certs\\local-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit

# Kotlin / Android defaults
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Build speed: reuse the daemon and build cache across builds.
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
